<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REEF CNC Milling Trainer</title>
<style>
/* Layout matches the REEF Nametag Maker: brand bar, tab row, visual stage (left, sticky) beside a control rail (right). */
:root{
  --red:#B71F34; --yellow:#FCC424; --blue:#05A7E0; --aqua:#7DCFD8; --ink:#010101; --reef-dark:#231F20; --orange:#F15B29; --gray:#424143;
  --bg:#F2F4F5; --surface:#FFFFFF; --fg:#151314; --muted:#5A5F63; --line:#D5DADD; --sel:#010101; --sel-fg:#FFFFFF;
  --stage:#E4E9EB; --focus:#05A7E0; --metal:#B5BBC0; --dark:#2B2829; --wood:#E8C99A; --woodline:#8A6A3E;
  --f-display:"Arial Black","Arial Bold",Arial,Helvetica,sans-serif;
  --f-body:"Post Grotesk",Arial,Helvetica,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --lvl:#5DBB46;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161415; --surface:#231F20; --fg:#F1F0F0; --muted:#A9A5A6; --line:#3A3536; --sel:#FFFFFF; --sel-fg:#010101;
  --stage:#2C2829; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#161415; --surface:#231F20; --fg:#F1F0F0; --muted:#A9A5A6; --line:#3A3536; --sel:#FFFFFF; --sel-fg:#010101;
  --stage:#2C2829; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);margin:0}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{background:var(--reef-dark);color:#fff;position:relative;z-index:30}
.bar .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand img{height:48px;width:auto;display:block}
.brand span{font-size:14px;opacity:.85;font-weight:700}
.barR{display:flex;align-items:center;gap:18px;margin-left:auto}
.dashes{display:flex;gap:4px}
.dashes i{display:block;width:22px;height:5px}
/* PrusaSlicer-style mode picker */
.mode{position:relative}
.mode>button{font:inherit;font-size:14px;background:#010101;color:#fff;border:1px solid #5A5556;border-radius:6px;padding:8px 12px;display:flex;align-items:center;gap:8px;cursor:pointer}
.mode>button:hover{border-color:#fff}
.mode>button .chev{width:12px;height:12px;opacity:.8}
.mode ul{position:absolute;right:0;top:calc(100% + 6px);margin:0;padding:4px 0;list-style:none;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 28px rgba(0,0,0,.25);min-width:220px}
.mode li button{font:inherit;font-size:14px;width:100%;background:none;border:0;color:inherit;display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;text-align:left}
.mode li+li{border-top:1px solid var(--line)}
.mode li button:hover,.mode li button[aria-checked="true"]{background:var(--bg)}
.mode li small{display:block;color:var(--muted);font-size:12px}
.tabsrow{max-width:1240px;margin:0 auto;padding-top:22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
main{max-width:1240px;margin:0 auto;padding-block:14px 40px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:880px){main{grid-template-columns:minmax(0,1fr)}}
.stagewrap{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:880px){.stagewrap{position:static}}
.stage{background:var(--stage);border-radius:6px;padding:18px;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:10px;min-height:320px}
.stage svg{width:100%;height:auto;max-height:62vh;display:block}
.stage svg.sec{max-height:28vh}
.stage h3{margin:0;font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:0;border-top:2px solid}
.sw.dash{border-top-style:dashed}
.sw.fill{height:10px;border:0}
.panel{display:flex;flex-direction:column;gap:18px;min-width:0}
section.grp{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:0;display:flex;align-items:center;gap:8px}
.lbl::before{content:"";width:10px;height:10px;background:var(--c,var(--red))}
.sub{font-size:13px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:13px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:7px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--sel-fg);border-color:var(--sel)}
.seg button:hover{border-color:var(--fg)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.seg.big button{font-size:15px;font-weight:700;padding:10px 16px;background:var(--surface)}
.seg.big button[aria-pressed="true"]{background:var(--sel)}
.ops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.ops button{font:inherit;font-size:13px;text-align:left;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;min-width:0}
.ops button[aria-pressed="true"]{border-color:var(--sel);box-shadow:inset 0 0 0 1px var(--sel)}
.ops button:hover{border-color:var(--fg)}
.ops button b{font-weight:700}
.slide{display:grid;grid-template-columns:110px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.slide span{color:var(--muted)}
.slide output{font-family:var(--f-mono);font-size:13px;text-align:right}
input[type=range]{width:100%;accent-color:var(--red)}
input[type=number]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:110px}
input:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.chk{display:inline-flex;align-items:flex-start;gap:9px;color:var(--fg);font-size:14px;cursor:pointer;line-height:1.35}
.chk input{width:18px;height:18px;accent-color:var(--red);margin:0;flex:none}
.btn{font:inherit;font-weight:700;border-radius:4px;padding:9px 14px;cursor:pointer;border:1px solid transparent}
.btn.pri{background:var(--yellow);color:#010101}
.btn.sec{background:transparent;color:var(--fg);border-color:var(--fg)}
.note{font-size:13px;color:var(--muted);margin:0}
.warn{background:var(--yellow);color:#010101;border-radius:4px;padding:8px 10px;font-size:13px}
.ok{background:var(--aqua);color:#010101;border-radius:4px;padding:8px 10px;font-size:13px}
.dims{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
table.cmp{width:100%;border-collapse:collapse;font-size:13px}
table.cmp th,table.cmp td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.cmp th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
table.cmp tbody tr:hover{background:var(--bg)}
table.cmp td:first-child{font-weight:700;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px;display:flex;flex-direction:column;gap:2px}
.card span{font-size:12px;color:var(--muted)}
.card b{font-family:var(--f-mono);font-size:19px;font-variant-numeric:tabular-nums}
.card small{font-size:12px;color:var(--muted)}
.card:hover{border-color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
.chip:hover{border-color:var(--fg)}
ul.plain{margin:0;padding-left:18px;font-size:14px}
ul.plain li{margin:3px 0}
.checks{display:flex;flex-direction:column;gap:10px}
.prog{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--red);width:0;transition:width .2s}
/* hover-info */
[data-info]{cursor:help}
.term{border-bottom:1px dotted var(--muted)}
svg [data-info]{transition:filter .12s}
svg [data-info]:hover,svg [data-info].on{filter:drop-shadow(0 0 3px #05A7E0) drop-shadow(0 0 1px #05A7E0)}
svg .hit{stroke:transparent;fill:none;stroke-width:9;pointer-events:stroke}
svg text{font-family:var(--f-body)}
.tip{position:fixed;z-index:60;max-width:340px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-left:5px solid var(--lvl);border-radius:6px;padding:10px 12px;box-shadow:0 10px 28px rgba(0,0,0,.22);pointer-events:none;font-size:13px;line-height:1.4}
.tip h4,#infoCard h4,#opInfo h4{margin:0 0 4px;font-family:var(--f-display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tip p,#infoCard p,#opInfo p{margin:5px 0}
.tag{font-family:var(--f-body);font-size:11px;letter-spacing:0;text-transform:none;padding:1px 6px;border-radius:3px;background:var(--fg);color:var(--bg)}
p.now{font-family:var(--f-mono);font-size:12px;background:var(--bg);padding:5px 7px;border-radius:4px}
p.more{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.lvp{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
#infoCard{font-size:14px;min-height:5em}
#infoCard .empty{color:var(--muted);margin:0}
@media (max-width:480px){.ops{grid-template-columns:minmax(0,1fr)}.slide{grid-template-columns:90px minmax(0,1fr) 56px}}
@media (prefers-reduced-motion:reduce){svg [data-info]{transition:none}}
/* photos */
figure.ph{margin:10px 0 0}
figure.ph img{display:block;width:100%;max-height:280px;object-fit:cover;border-radius:4px;cursor:zoom-in;background:var(--bg)}
figure.ph figcaption{font-size:11px;color:var(--muted);margin-top:4px}
p.lnk{margin:8px 0 0;font-size:13px}p.lnk a{color:var(--fg);font-weight:700}
p.pinned{font-size:11px;color:var(--muted);margin:8px 0 0}
.lb{position:fixed;inset:0;z-index:80;background:rgba(1,1,1,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;cursor:zoom-out}
.lb img{max-width:94vw;max-height:84vh;border-radius:6px}
.lb .btn{color:#fff;border-color:#fff}
.staffbar{background:var(--yellow);color:#010101}
.staffbar .in{max-width:1240px;margin:0 auto;padding:10px 0;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px}
.staffbar .chip{background:#fff;color:#010101;border-color:#010101}
.staffbar .btn.pri{background:#010101;color:#fff}
.staffc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.staffc .sub{width:100%}
/* Stella, the guide */
#stella{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:58;font-size:14px}
.stella-btn{position:relative;display:block;margin-left:auto;width:84px;height:84px;padding:0;border:0;background:none;cursor:pointer}
.stella-btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:50%}
.star{display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));transform-origin:50% 70%}
.star.mini{filter:none}
.star .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);transition:transform .5s ease}
.star .yawn{opacity:0;transform-box:fill-box;transform-origin:50% 0}
.star .smile{transition:opacity .3s}
.star.bored .lid{transform:scaleY(1)}
.star.bored .smile{opacity:0}
.star.bored .yawn{opacity:1}
@media (prefers-reduced-motion:no-preference){
.star.idle{animation:bob 3.5s ease-in-out infinite}
.star.wiggle{animation:wig .9s ease-in-out 2}
.star.jump{transform-origin:50% 54%;animation:jump 1s cubic-bezier(.3,.7,.4,1)}
.star.bored{animation:droop 4s ease-in-out infinite}
.star.bored .yawn{animation:yawn 3.2s ease-in-out infinite}
#stella.bored .zzz i{animation:rise 3s ease-in infinite}
#stella.bored .zzz i:nth-child(2){animation-delay:1s}
#stella.bored .zzz i:nth-child(3){animation-delay:2s}
#stella.bored .zzz b{animation:rise 3.4s ease-in-out infinite .5s}
#stella.bored .zzz b:nth-of-type(2){animation-delay:2.2s}}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
@keyframes wig{25%{transform:rotate(-10deg) translateY(-6px)}75%{transform:rotate(10deg) translateY(-6px)}}
@keyframes jump{0%{transform:translateY(0) rotate(0) scale(1,1)}14%{transform:translateY(0) rotate(0) scale(1.12,.84)}50%{transform:translateY(-70px) rotate(200deg) scale(.96,1.04)}82%{transform:translateY(0) rotate(360deg) scale(1.1,.88)}100%{transform:translateY(0) rotate(360deg) scale(1,1)}}
@keyframes droop{0%,100%{transform:rotate(-7deg) translateY(3px)}50%{transform:rotate(5deg) translateY(5px)}}
@keyframes yawn{0%,100%{transform:scaleY(.35)}35%,60%{transform:scaleY(1.15)}}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(-8px,-56px);opacity:0}}
.zzz{position:absolute;right:54px;top:-6px;width:40px;height:60px;pointer-events:none;opacity:0;transition:opacity .4s}
#stella.bored .zzz{opacity:1}
.zzz i{position:absolute;bottom:0;border:2px solid var(--aqua);border-radius:50%;opacity:0}
.zzz i:nth-child(1){width:10px;height:10px;left:18px}.zzz i:nth-child(2){width:7px;height:7px;left:6px}.zzz i:nth-child(3){width:12px;height:12px;left:26px}
.zzz b{position:absolute;bottom:0;font-family:var(--f-display);color:var(--blue);opacity:0}
.zzz b:nth-of-type(1){left:4px;font-size:13px}.zzz b:nth-of-type(2){left:22px;font-size:17px}
.hello{position:absolute;right:92px;bottom:20px;width:max-content;max-width:min(260px,calc(100vw - 120px));background:var(--yellow);color:#010101;border-radius:16px 16px 4px 16px;padding:10px 14px;box-shadow:0 8px 22px rgba(0,0,0,.2);font-weight:700;line-height:1.35}
.hello .row{margin-top:8px;gap:6px}
.hello button{font:inherit;font-size:13px;font-weight:700;border-radius:999px;padding:5px 12px;cursor:pointer;border:1px solid #010101;background:#010101;color:#fff}
.hello button+button{background:transparent;color:#010101}
.spanel{position:absolute;right:0;bottom:96px;width:min(360px,calc(100vw - 32px));max-height:min(72vh,580px);display:flex;flex-direction:column;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 36px rgba(0,0,0,.28);overflow:hidden}
.shead{display:flex;align-items:center;gap:8px;background:var(--reef-dark);color:#fff;padding:8px 10px}
.shead span{font-size:12px;opacity:.8}
.shead button{background:none;border:0;color:#fff;font-size:22px;line-height:1;cursor:pointer;padding:2px 6px}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.msg{max-width:88%;padding:8px 11px;line-height:1.4}
.msg.s{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:12px 12px 12px 3px}
.msg.u{align-self:flex-end;background:var(--fg);color:var(--bg);border-radius:12px 12px 3px 12px}
.msg ol,.msg ul{margin:6px 0 0;padding-left:18px}.msg p{margin:0 0 6px}
.opts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.opts .chip{font-size:13px}
.opts .chip.go{background:var(--yellow);color:#010101;border-color:var(--yellow);font-weight:700}
.pulse{animation:hpulse .9s ease-in-out infinite alternate;border-radius:6px}
@keyframes hpulse{from{box-shadow:0 0 0 2px #FCC424}to{box-shadow:0 0 0 7px rgba(252,196,36,.45)}}
svg .pulse{animation:spulse .9s ease-in-out infinite alternate}
@keyframes spulse{from{filter:drop-shadow(0 0 2px #FCC424)}to{filter:drop-shadow(0 0 9px #FCC424) drop-shadow(0 0 3px #B71F34)}}
@media (prefers-reduced-motion:reduce){.pulse,svg .pulse{animation:none;box-shadow:0 0 0 4px #FCC424}}
.shead .sreset{margin-left:auto;font:inherit;font-size:12px;font-weight:700;color:#fff;background:transparent;border:1px solid #6A6566;border-radius:999px;padding:3px 10px;cursor:pointer}
.shead .sreset:hover{border-color:#fff}
.shead .sreset+button{margin-left:4px}
.spanel.dockL{position:fixed;right:auto;left:max(16px,env(safe-area-inset-left,0px));bottom:16px}
.spot-ring{position:fixed;z-index:57;pointer-events:none;border:4px solid #FCC424;border-radius:10px;box-shadow:0 0 0 2px #010101,0 0 22px 6px rgba(252,196,36,.75)}
.spot-tag{position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:#FCC424;color:#010101;font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px;box-shadow:0 0 0 2px #010101;white-space:nowrap}
.spot-ring.below .spot-tag{top:auto;bottom:-34px}
@media (prefers-reduced-motion:no-preference){.spot-ring{animation:ringp .9s ease-in-out infinite alternate}}
@keyframes ringp{from{box-shadow:0 0 0 2px #010101,0 0 8px 2px rgba(252,196,36,.5)}to{box-shadow:0 0 0 2px #010101,0 0 26px 10px rgba(252,196,36,.85)}}
@media print{#stella,.tip,.spot-ring{display:none!important}}
.secbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.secbar .btn{padding:7px 12px;font-size:14px}
.secprog{flex:1;min-width:80px}
p.seccap{min-height:2.9em;font-size:14px;color:var(--fg)}
/* level gating */
body[data-mode="1"] [data-min="2"],body[data-mode="1"] [data-min="3"],body[data-mode="2"] [data-min="3"]{display:none!important}
</style></head><body data-mode="1">

  so_spindle: { t: `VFD spindle`, tag: `65 mm · 1.2 kW · 110 V`, b: `The motor that spins the endmill. It’s quieter than a router, but cutting is still loud — wear hearing protection.`,
    i: `Speed (8,000–24,000 RPM) is set by the G-code: Carbide Motion starts the spindle at the RPM from your CAM file. It’s air-cooled — keep the fan vents at the top clear of dust and chips.`,
    e: `A VFD spindle holds its speed under load and has more torque at low RPM than a trim router, so the feed you calculate is the chipload you get. REEF plywood starting point: 18,000 RPM at 100 in/min (1/4″ 2-flute).` },
  so_collet: { t: `Collet & nut`, b: `The clamp that grips the endmill shank.`,
    i: `ER-16 collets: REEF uses 1/8″ and 1/4″ tools. Match the collet to the shank — never shim a tool into the wrong collet.`,
    e: `Insert at least 3× the shank diameter, keep the collet and taper clean, and don’t bottom the tool out. Runout of even 0.02 mm loads one flute more than the other and wears small tools fast.` },
  so_bit: { t: `Endmill`, b: `The cutting tool. The Endmills tab covers the flat, ball, and tapered tools REEF uses.`,
    i: `Make sure the tool you install matches the tool number and size in your CAM file.`,
    e: `Deflection scales with stick-out³: doubling stick-out makes the tool about 8× more flexible.` },
  so_waste: { t: `Spoilboard`, tag: `4 × 4 ft bed`, b: `The sacrificial board under your material. It’s okay to cut slightly into it on through-cuts.`,
    i: `At REEF, material is held down with composite brad nails shot into the spoilboard (or clamps) — not by locking into the aluminum frame. The spoilboard is surfaced (faced) now and then so it stays flat to the gantry.`,
    e: `For through-cuts go 0.2–0.5 mm below the stock bottom. Measure stock with calipers — “3/4 in” plywood is often 0.70–0.72 in.` },
  so_clamps: { t: `Brad nails & clamps`, tag: `composite nails`, b: `A brad nailer shoots plastic (composite) nails through your material into the spoilboard so it can’t move or fly loose. Loose stock is dangerous.`,
    i: `Composite nails are plastic, so if the endmill clips one it cuts through instead of breaking the bit — but still put them in <b>waste areas</b>, outside every toolpath, so they don’t pull a part loose or leave plastic in your cut. Never use steel brads or staples. Keep any clamps below the safe (retract) height.`,
    e: `Nail near the middle of large sheets too, so they stay flat. After the job, pry the sheet up — the nails shear off; leftover stubs in the spoilboard get removed when it’s surfaced. Pair nails with tabs or onion-skin passes so small parts can’t break free.` },
  so_stock: { t: `Stock (your material)`, b: `The raw material you’re cutting.`,
    i: `On the Shapeoko at REEF: wood, plywood, MDF, plastics (HDPE, acetal, acrylic) and foam. Aluminum goes on the Carvera Air.`,
    e: `Model true thickness in CAM and make the stock box slightly bigger than the real piece — all depths are computed from it.` },
  so_bitsetter: { t: `BitSetter (tool length sensor)`, b: `A button the tool touches after a tool change, so the machine knows how long the new tool is.`,
    i: `Carbide Motion uses it automatically at tool changes — you don’t re-zero Z for each tool.`,
    e: `It stores length relative to the first tool measured. If you re-zero Z afterward, re-measure or the offsets will be wrong.` },
  so_bitzero: { t: `BitZero (XYZ probe)`, b: `A probe block that finds the corner and top of your material accurately.`,
    i: `Set it on the front-left corner of the stock, clip the magnet to the collet, and run probing in Carbide Motion.`,
    e: `Probing assumes a clean, square corner. On rough stock, probe Z on the top and locate X/Y from a fixture or fence instead.` },
  so_dust: { t: `Dust boot & vacuum`, b: `Sucks up chips and dust. Turn the vacuum on before you start the cut.`,
    i: `Chips left in a slot get re-cut — that heats the tool and roughens the finish.`,
    e: `Evacuation matters more as DOC increases. In plastics poor evacuation means melting and chips welding back onto the part.` },
  so_sw: { t: `Carbide Motion`, tag: `sender`, b: `The program on the computer that runs the Shapeoko: connect, jog, set zero, and send the job.`,
    i: `Load the .nc file from Carbide Create or Fusion 360, then Initialize → Jog → Zero → Run.`,
    e: `Use feed-rate override to adjust while cutting; listen for chatter and look at the chips before committing to a long job.` },
  // ---------- Carvera Air ----------
  ca_enc: { t: `Enclosure`, b: `Fully enclosed so chips stay inside while you watch through the window.`,
    i: `Keep the door closed while cutting — it contains aluminum chips and cuts noise.`,
    e: `The enclosure doesn’t remove fine dust (MDF!). Vacuum chips out after the job.` },
  ca_window: { t: `Viewing window`, b: `Watch the cut. If anything looks or sounds wrong, pause the job.` },
  ca_motion: { t: `Motion system`, b: `Moves the spindle in X, Y, and Z inside the box.`,
    i: `Work area is 300 × 200 × 130 mm — think small, precise parts.`,
    e: `Small and stiff: great accuracy, but the 200 W spindle limits material removal rate, not the frame.` },
  ca_spindle: { t: `Spindle (200 W)`, tag: `0–13,000 RPM`, b: `Spins the endmill. Its speed is set by the program — no dial.`,
    i: `Less power than the Shapeoko’s router, so it takes lighter cuts. It’s accurate for small parts and can cut aluminum.`,
    e: `Closed-loop speed control up to 13,000 RPM. With 200 W, removal rate (DOC × WOC × feed) is the limit — use adaptive clearing: deep DOC, narrow WOC.` },
  ca_collet: { t: `Collet & bit collar`, b: `Carvera tools wear a small ring (bit collar) so the machine can grab them the same way every time.`,
    i: `Ships with a 1/8″ (3.175 mm) collet. 1/4″ tools need the 1/4″ collet <b>and</b> a 1/4″ bit collar.`,
    e: `Collars set a repeatable stick-out; use the collar installer so tool lengths stay consistent from job to job.` },
  ca_qtc: { t: `Quick tool change lever`, b: `Flip the lever to release and insert a tool — no wrenches.`,
    i: `The machine pauses at each tool change in the program and prompts you to swap tools.`,
    e: `Each new tool is measured automatically, so tool numbers in Fusion must match the physical tools you load.` },
  ca_tls: { t: `Tool length sensor`, b: `The machine touches the tool here to measure how long it is.`,
    i: `Runs automatically at tool changes. Keep the top of the sensor free of chips.`,
    e: `A chip on the sensor makes the tool read long → every cut ends up shallow. Blow it off before long jobs.` },
  ca_probe: { t: `Probe & auto-leveling`, b: `Finds the edges and top of your material for you.`,
    i: `Auto-leveling is great for PCBs and shallow engraving on stock that isn’t perfectly flat.`,
    e: `Leveling probes a grid of points and warps the toolpath Z to match the surface — essential for 0.1 mm-deep engraving.` },
  ca_bed: { t: `Worktable & clamps`, b: `The bed where material is clamped or taped down.`,
    i: `Use the clamps or a small vise; keep them out of the toolpath.`,
    e: `For aluminum, prefer mechanical clamping — tape can release as the part warms.` },
  ca_stock: { t: `Stock`, b: `Wood, plastics, foam, PCB blanks — and aluminum, brass, or copper.`,
    i: `Aluminum jobs at REEF go on the Carvera Air, not the Shapeoko.`,
    e: `6061 machines cleanly; avoid gummy pure aluminum (1100). No steel.` },
  ca_sw: { t: `Makera Controller`, tag: `sender`, b: `The program that sends your job to the Carvera Air (Wi-Fi or USB).`,
    i: `Upload the .nc from Fusion 360, set the work origin / probe, then start.`,
    e: `Post with the Makera Carvera post processor in Fusion so tool changes and probing commands come out correctly.` },
  ca_addons: { t: `Optional modules`, b: `Extra heads you can add.`, i: `Carvera Air supports an optional 4th-axis rotary and a 5 W laser module.` },
  // ---------- Endmills ----------
  em_flat: { t: `Flat endmill`, b: `Square bottom. Cuts flat floors and straight walls — your everyday tool for cutting out parts and pockets.`,
    i: `Used for Contour, Pocket, Face, and Adaptive. Inside corners come out rounded with radius = tool radius.`,
    e: `Design inside fillets ≥ tool radius (or add dogbones for square-fitting joints). On 3D surfaces a flat tool leaves visible “stair steps”.` },
  em_ball: { t: `Ball endmill`, b: `Rounded tip. Makes smooth, curved 3D surfaces and rounded grooves.`,
    i: `Used for 3D finishing in Fusion (Parallel, Scallop) and for round-bottom channels. Smaller stepover = smoother surface.`,
    e: `Surface speed is zero at the exact tip, so it rubs on flat areas. Effective diameter at depth a: D<sub>eff</sub> = 2√(a(D−a)).` },
  em_taper: { t: `Tapered endmill / V-bit`, b: `Pointed (or tiny) tip that widens as it goes deeper. Makes V-grooves, lettering, chamfers, and fine detail.`,
    i: `Carbide Create’s V-Carve uses a V-bit: going deeper makes the cut wider, so sharp inside corners in text come out crisp. Fusion’s 2D Chamfer bevels edges with it. Tapered ball endmills do fine 3D detail.`,
    e: `Width at depth d = tip + 2·d·tan(θ/2), θ = included angle. A tapered ball gives you a tiny tip on a strong, thick body — far stiffer than a straight tool with the same tip size.` },
  em_shank: { t: `Shank`, b: `The smooth part held in the collet. It doesn’t cut.`,
    i: `Common sizes: 1/8″ (3.175 mm) and 1/4″ (6.35 mm). The shank must match the collet.`,
    e: `Insert ≥ 3× shank diameter. Reduced-neck tools give reach without long, weak flutes.` },
  em_flutes: { t: `Flutes`, b: `The spiral grooves with cutting edges. Chips escape up (or down) through them.`,
    i: `1–2 flutes: lots of chip room → plastics, wood, and aluminum on small machines. 3+ flutes: smoother finish but chips can pack.`,
    e: `Feed = RPM × flutes × chipload, so flute count changes the feed you need. Single-flute “O-flute” tools are the go-to for plastics.` },
  em_loc: { t: `Length of cut`, b: `How deep the flutes reach. Never cut deeper than this.`,
    i: `Longer flutes are weaker and bend more. Choose the shortest tool that reaches your depth.`,
    e: `Adaptive clearing can use most of the length of cut as DOC because the width of cut is small.` },
  em_dia: { t: `Cutting diameter (D)`, b: `How wide a cut the tool makes.`,
    i: `Bigger tools are stronger and faster; smaller tools reach finer detail and tighter corners.`,
    e: `Stiffness scales with D⁴: a 1/4″ tool is ~16× stiffer than a 1/8″ tool of the same length.` },
  em_helix: { t: `Helix & cut direction`, b: `The twist of the flutes decides whether chips are pulled up or pushed down.`,
    i: `<b>Upcut</b> pulls chips up: clean slots, fuzzy top edge, can lift thin parts. <b>Downcut</b> pushes down: clean top edge, but chips pack. <b>Compression</b>: both — clean top and bottom edges on plywood.`,
    e: `Compression tools only work once the upcut portion is fully in the material — first pass DOC must exceed the upcut length.` },
  em_tipflat: { t: `Square end`, b: `Flat bottom → flat floors.`, i: `Sharp corners can chip; handle tools by the shank.`,
    e: `Corner-radius (“bull nose”) tools keep flat floors with stronger corners and better 3D roughing.` },
  em_tipball: { t: `Ball tip`, b: `A full half-sphere with radius = D/2.`, i: `In Fusion, pick a ball tool for 3D finishing passes after roughing with a flat.`,
    e: `Scallop height h = R − √(R² − (s/2)²) for stepover s. Halving stepover cuts scallop height ~4×.` },
  em_tiptaper: { t: `Tip & angle`, b: `The narrow end. The angle sets how fast the cut widens as the tool goes deeper.`,
    i: `Common V-bits: 60° (deeper, narrower) and 90° (shallower, wider). Tapered endmills use small per-side angles like 3–10°.`,
    e: `Check whether software wants the <b>included</b> angle or the <b>per-side</b> angle (Fusion uses per-side “taper angle”). Mixing them up doubles the width error.` },
  em_groove: { t: `Groove profile`, b: `The shape this tool leaves in the material, seen from the end of the cut.`,
    i: `Flat → square slot. Ball → round “U”. Tapered → “V”.`, e: `Drag the depth slider to see the width the tool actually cuts at that depth.` },
  em_deff: { t: `Width at this depth`, b: `How wide the cut is at the depth you chose.`,
    e: `For ball and tapered tools this is less than the full diameter — use it for chipload, stepover and scallop math.` },
  // ---------- Toolpaths ----------
  tp_stock: { t: `Stock`, b: `The block of material, seen from above.`, i: `Its size and thickness are set in CAM (Carbide Create: Job Setup; Fusion: Setup → Stock).` },
  tp_part: { t: `Part geometry`, b: `The shapes you drew. Toolpaths are calculated from these lines.`,
    i: `Closed shapes are needed for pockets and profiles; open lines can only be followed “on the line”.` },
  tp_cut: { t: `Cutting move (feed)`, b: `The tool is in the material, moving at the feed rate. Solid red lines.`,
    i: `The line is the <b>center</b> of the tool — CAM offsets it by the tool radius so the edge lands on your geometry.`,
    e: `Fusion G1 moves; arcs may be output as G2/G3. Climb vs conventional depends on direction around the shape — the arrows show it.` },
  tp_rapid: { t: `Rapid move (G0)`, b: `A fast move with the tool lifted up out of the material. Dashed blue lines.`,
    i: `Rapids happen at the safe/retract height — make sure clamps are below that height!`,
    e: `Fusion has Clearance, Retract and Feed heights. Set Clearance above clamps and Retract just above the stock to cut air time.` },
  tp_ramp: { t: `Ramp / helix entry`, b: `The tool eases into the material at an angle instead of drilling straight down.`,
    i: `Endmills cut poorly straight down. Ramping protects the tool, especially in hardwood and aluminum.`,
    e: `Typical ramp angle: 2–5° in wood/plastic, 1–2° in aluminum; helical ramp diameter ≈ 1.2× tool diameter or more.` },
  tp_plunge: { t: `Plunge`, b: `The tool moves straight down into the material.`,
    i: `Plunge rate is slower than feed (≈ 1/3). Drill and V-carve toolpaths plunge on purpose.`,
    e: `Peck drilling retracts every few mm to clear chips — use it for holes deeper than ~2× D.` },
  tp_tab: { t: `Tab (bridge)`, b: `Little bits left uncut so your part stays attached and can’t fly loose at the end.`,
    i: `Cut the tabs with a flush-cut saw or knife, then sand. Add them in the Contour toolpath (Carbide Create) or the Tabs section of 2D Contour (Fusion).`,
    e: `Tab height ≈ 1/4–1/3 of thickness; width ≥ 2× tool D in wood. Alternative: onion-skin — leave 0.3 mm and finish with a light final pass.` },
  tp_lead: { t: `Lead-in / lead-out`, b: `A short approach so the tool doesn’t leave a mark where it starts and stops.`,
    i: `Fusion adds arc lead-ins automatically in 2D Contour (Linking tab).`, e: `Lead radius ≈ 0.5–1× tool D. Skipping it leaves a witness mark on the wall.` },
  tp_tool: { t: `Tool position`, b: `The circle shows the size of the tool following the path.`, i: `Press Play to watch the order of moves.` },
  tp_zero: { t: `Work zero (X0 Y0 Z0)`, b: `The point the machine treats as 0, 0, 0. It must match the origin you chose in CAM.`,
    i: `Most common: front-left corner, top of stock. Zero the machine at the same spot you picked in CAM.`,
    e: `Fusion: Setup → WCS orientation and origin (Stock box point). Mixing up Z0 on the stock top vs. the spoilboard is the classic crash.` },
  tp_step: { t: `Stepover`, b: `How far the tool moves sideways between passes.`,
    i: `Clearing with a flat endmill: 40–50% of D. Finishing: smaller stepover = smoother surface.`,
    e: `Ball finishing: scallop h = R − √(R² − (s/2)²). Adaptive uses “optimal load” instead of stepover.` },
  sec_stock: { t: `Stock (side view)`, b: `A slice through the material so you can see how deep each cut goes.` },
  sec_spoil: { t: `Spoilboard`, b: `The sacrificial board under the material.`, i: `Through-cuts go a tiny bit into it so the part releases cleanly.` },
  sec_cut: { t: `Material removed`, b: `The empty area is what this toolpath cuts away.` },
  sec_pass: { t: `Depth passes (stepdown)`, b: `Deep cuts are done in several shallower layers.`,
    i: `Each dashed line is one pass. Pass depth depends on tool, material and machine — see Feeds & Speeds.`,
    e: `Adaptive clearing flips this: one deep pass with a narrow width. Uniform engagement keeps chipload and heat constant.` },
  // ---------- Operations ----------
  op_contour: { t: `Contour`, tag: `Carbide Create`, b: `Cuts along a line — usually around the outside of a part to cut it free.`,
    i: `Choose <b>Outside</b> (parts), <b>Inside</b> (holes), or <b>On the line</b>. Add tabs for through-cuts.`,
    e: `A final pass leaving 0.2 mm, then a full-depth spring pass, gives cleaner walls on a router. Climb vs conventional changes finish and chatter.` },
  op_pocket: { t: `Pocket`, tag: `Carbide Create`, b: `Clears all the material inside a shape down to a set depth.`,
    i: `Stepover ≈ 40%. Depth is measured from the top of the stock (Z0).`,
    e: `Offset pockets bury the tool at full width on the first pass — lower DOC there, or use Fusion Adaptive for deep pockets.` },
  op_vcarve: { t: `V-Carve`, tag: `Carbide Create`, b: `A V-bit carves letters and shapes, going deeper where the shape is wider.`,
    i: `Perfect for signs. The point reaches into sharp corners, so text stays crisp. Wide areas can be flat-cleared with a second “pocket” tool.`,
    e: `Max depth = (width/2) / tan(θ/2). Set a Max Depth for flat-bottom V-carving plus a clearing tool for wide letters.` },
  op_drill: { t: `Drill`, tag: `Carbide Create`, b: `Plunges straight down to make holes the same size as the tool.`,
    i: `For holes bigger than the tool, use Contour (Inside) or Pocket instead.`,
    e: `Endmills aren’t drills: low plunge feed and peck to clear chips in deep holes.` },
  op_face: { t: `Face`, tag: `Fusion 360`, b: `Skims the top of the stock flat and clean.`,
    i: `Run it first so your Z0 surface is flat. Shallow depth, big tool.`,
    e: `60–75% stepover with a large flat tool and a small DOC. Same operation surfaces a spoilboard.` },
  op_contour2d: { t: `2D Contour`, tag: `Fusion 360`, b: `Follows the edge of your model to cut the part out or finish walls.`,
    i: `Select the bottom edge chain; Fusion picks the side. Add Tabs and Multiple Depths for through-cuts.`,
    e: `Use Stock to Leave on roughing passes and a separate finishing contour; arc lead-in/out avoids witness marks.` },
  op_pocket2d: { t: `2D Pocket`, tag: `Fusion 360`, b: `Clears inside a shape, layer by layer.`,
    i: `Fusion ramps in with a helix by default. Choose Multiple Depths for the layer size.`,
    e: `For deep or hard-material pockets, Adaptive is usually faster and kinder to the tool — especially on the Carvera Air.` },
  op_adaptive: { t: `2D Adaptive Clearing`, tag: `Fusion 360`, b: `Smart pocket clearing: looping moves keep the load on the tool steady.`,
    i: `Lets small machines cut deep with a narrow width — faster, cooler, and longer tool life. Great on the Carvera Air.`,
    e: `Optimal load ≈ 10–15% D (≈ 8% in aluminum on the Carvera Air), DOC up to 2–3× D. Leave 0.2–0.3 mm stock and finish with Contour/Pocket.` },
  op_bore: { t: `Bore (helical)`, tag: `Fusion 360`, b: `Spirals down to cut a round hole bigger than the tool.`,
    i: `Select the hole’s cylinder face; Fusion makes the helix. Works for any hole larger than the tool.`,
    e: `Keep pitch per revolution small (≈ 0.3–0.5 mm in aluminum). Add a finishing pass for accurate press-fit sizes.` },
  op_chamfer: { t: `2D Chamfer`, tag: `Fusion 360`, b: `Bevels sharp edges with a V-bit / chamfer tool.`,
    i: `Select the edge and set chamfer width. The tool tip runs slightly below the edge so the bevel is clean.`,
    e: `Tip offset keeps the fragile point out of the cut; set it ~0.2–0.5 mm. Needs a tool with a correct taper angle in the library.` },
  op_parallel: { t: `3D Parallel finishing`, tag: `Fusion 360`, b: `Back-and-forth lines over a curved 3D shape with a ball endmill for a smooth surface.`,
    i: `Rough first (3D Adaptive with a flat), then finish with Parallel. Smaller stepover = smoother, but slower.`,
    e: `Parallel works best on shallow slopes; steep walls get wide scallops — combine with Contour or use Scallop/Steep & Shallow.` },
  // ---------- Feeds & speeds ----------
  fs_rpm: { t: `Spindle speed (RPM)`, b: `How fast the tool spins.`,
    i: `Too fast with too little feed rubs and burns; too slow with too much feed overloads the tool.`,
    e: `RPM and feed are linked by chipload. Pick RPM within the machine’s range first, then compute feed.` },
  fs_dial: { t: `Router dial setting`, b: `The Compact Router speed is set by hand. Turn the dial to this number before you start.` },
  fs_feed: { t: `Feed rate`, b: `How fast the tool moves through the material.`,
    i: `Feed = RPM × flutes × chipload.`, e: `With chip thinning compensation applied for narrow cuts (adaptive / finishing).` },
  fs_plunge: { t: `Plunge rate`, b: `How fast the tool moves down into the material.`,
    i: `About one third of the feed. Ramp instead of plunging when you can.`, e: `Aluminum: ¼ of feed and ramp at 1–2°.` },
  fs_doc: { t: `Depth of cut (DOC)`, b: `How deep each pass goes.`,
    i: `Also called “stepdown” or “pass depth”. Full-width slots need the shallowest passes.`,
    e: `Adaptive: deep DOC (≈ 1–2× D) with small width. The Carvera Air gets lighter cuts than the Shapeoko in wood and plastic.` },
  fs_woc: { t: `Width of cut / stepover`, b: `How much of the tool’s side is cutting.`,
    i: `Slot = 100%. Pocket = ~40%. Adaptive = ~10–15%. Finishing = small.`, e: `Narrow width thins the chips — see the chip-thinning factor.` },
  fs_chip: { t: `Chipload`, b: `The thickness of the chip each cutting edge takes. Good chips = sharp tool, clean cut, no burning.`,
    i: `Wood should make chips, not dust. Fine dust = chipload too small (rubbing).`, e: `Interpolated by tool diameter from the REEF material table at the top of this file.` },
  fs_mrr: { t: `Material removal rate`, b: `How much material is removed per minute.`, e: `MRR = DOC × WOC × feed. On the 200 W Carvera Air this is the real limit.` },
  fs_ctf: { t: `Chip-thinning factor`, b: `When only a sliver of the tool engages, chips get thinner than the feed suggests.`,
    e: `RCTF = 1/√(1 − (1 − 2·ae/D)²) for ae &lt; D/2. Feed is multiplied by this (capped at 2×) to restore the target chipload.` },
  fs_deff: { t: `Effective diameter`, b: `A ball or V tool cutting shallow is really a smaller tool.`, e: `Ball: D<sub>eff</sub> = 2√(a(D−a)). Lower D<sub>eff</sub> → lower surface speed at the same RPM.` },
  fs_scallop: { t: `Scallop height`, b: `The tiny ridges a ball endmill leaves between passes.`, e: `h = R − √(R² − (s/2)²).` },
  fs_mat: { t: `Material`, b: `The material being cut — this sets chipload, speed and depth.` },
  fs_tool: { t: `Endmill in the cut`, b: `Side view of the tool engaged in the material.` },
  fs_rot: { t: `Rotation`, b: `Spindles turn clockwise (looking down). The cutting edges meet the material as the tool moves.` },
  fs_dir: { t: `Feed direction`, b: `The direction the tool is travelling.`, i: `Climb milling: the cutter rotation and travel go the same way at the cut. Conventional: opposite.` },
  fs_top: { t: `Top view of engagement`, b: `Seen from above: the shaded area is the part of the tool that’s cutting.` }
};

<script>

  }

  var op = P.d3 ? "parallel" : sw === "cc" ? "contour" : "contour2d", flowK = mach === "ca" ? "ca_f" : sw === "cc" ? "so_cc" : "so_f";
  say("<p><b>My suggestion</b></p><ul><li>Machine: <b>" + MACH[mach].name + "</b></li><li>CAM: <b>" + (sw === "cc" ? "Carbide Create" : "Fusion 360") + "</b></li><li>Tools: " +

    (mach === "so" && !P.big && !P.d3 ? "<p>The Carvera Air could also do a small flat part in Fusion 360 — the Shapeoko with Carbide Create is the simpler place to start.</p>" : "") +
    (P.d3 && !P.big ? "<p>The Carvera Air is great for small, precise 3D parts.</p>" : ""));
  choices([["Show me the toolpath", function () {
      if (OPS[op].lv > S.mode) { setMode(OPS[op].lv); say("That toolpath lives in <b>" + MODES[OPS[op].lv].n + " mode</b>, so I switched you there."); }
      go("paths", function () { S.sw = sw; S.op = op; }, "#playBtn"); say("Press the glowing <b>Play</b> button to watch it run. Hover any line to see what it is.");
      choices([["Show feeds &amp; speeds next", feedsGo, 1], ["Show the workflow", flowGo], BACK]); }, 1],
    ["Show feeds &amp; speeds", feedsGo], ["Show the workflow", flowGo], ["Start over", proj]]);
  function feedsGo() { go("feeds", function () { S.f.m = mach; S.f.mat = P.mat; S.f.tool = P.d3 ? "ball" : "flat"; S.f.dia = mach === "ca" ? 3.175 : 6.35; S.f.strat = "slot"; }, "#rail .cards");
    say("These are starting numbers for " + MACH[mach].short + " in " + MATS[P.mat].n.split(" (")[0].toLowerCase() + ". Hover a card to learn what it means — and always make a test cut."); choices([["Show the workflow", flowGo, 1], BACK]); }
  function flowGo() { go("flow", function () { S.flow = flowK; }, "#rail .checks"); say("Here’s the path from design to finished part. Tick the checklist before you press start!"); choices([["Quiz me", quizStart], BACK]); }
}
/* --- page help --- */
var TIPS = {
  machines: [["Hover any part of the machine to learn about it. <b>Click</b> a part to pin it in the Info panel — some have photos.", '#stage [data-info="' + "so_spindle" + '"]', function () { S.mach = "so"; }],
    ["Switch between the Shapeoko 5 Pro and the Carvera Air here.", '#rail [data-set="mach"]'], ["Not sure which machine to use? Pick your material here.", '#rail [data-set="helpMat"]']],
  tools: [["Start with the <b>Flat</b> endmill — it does most jobs. Hover the flutes and the tip.", '#stage [data-info="em_flutes"]'],
    ["The groove on the right shows the shape each tool leaves. Try Ball and Tapered.", '#stage [data-info="em_groove"]'], ["Click a chip here to watch that tool in a toolpath.", "#rail .chips"]],
  paths: [["Press <b>Play</b> to watch the tool move. Solid red = cutting, dashed blue = moving in the air.", "#playBtn"],
    ["Switch between Carbide Create and Fusion 360 to see each program’s toolpaths.", '#rail [data-set="sw"]'], ["The side view animates how the cut happens, pass by pass — press its <b>Play</b> button.", "#secPlay"]],
  feeds: [["Pick the machine, material and tool — the numbers update instantly.", '#rail [data-set="f.mat"]'], ["Hover a result card to learn what it means.", "#rail .cards"],
    ["Numbers are a starting point. Use <b>Listen &amp; look</b> to fine-tune by sound and chips.", "#rail section:last-child"]],
  flow: [["Hover each step to see what happens from design to finished part.", '#stage [data-info="wf_0"]'], ["Tick this checklist before every job.", "#rail .checks"],
    ["Pick your machine and software — the steps change to match.", '#rail [data-set="flow"]']]
};
function tabHelp(n) {
  n = typeof n === "number" ? n : 0; var t = TIPS[S.tab], tp = t[n % t.length];

/* --- guided tour --- */
var TOUR = [
  ["machines", "#modeBtn", "This button sets your level. <b>Beginner</b> keeps it simple; <b>Expert</b> shows the math.", function () { S.mach = "so"; }],
  ["machines", '#stage [data-info="so_spindle"]', "Hover any part of the machine. <b>Click</b> it to pin the details in the Info panel — some parts have photos.", function () { S.mach = "so"; }],
  ["machines", '#rail [data-set="mach"][data-v="ca"]', "Switch between the Shapeoko 5 Pro and the Carvera Air here."],
  ["tools", '#rail [data-set="tool"][data-v="flat"]', "REEF uses three endmills: flat, ball and tapered. Flat does most jobs.", function () { S.tool = "flat"; }],
  ["tools", '#stage [data-info="em_groove"]', "This shows the groove each tool leaves in the material."],
  ["paths", "#playBtn", "Press <b>Play</b> to watch a toolpath. Solid red = cutting, dashed blue = moving in the air.", function () { S.sw = "cc"; S.op = "contour"; }],
  ["paths", "#secPlay", "This side-view animation shows <b>how the operation cuts</b>, pass by pass — with Play/Pause and Reset."],
  ["feeds", "#rail .cards", "Pick machine, material and tool to get starting speeds and feeds."],
  ["flow", "#rail .checks", "Before every job, run this checklist. When in doubt, ask REEF staff!"]
];
function tour(i) {
  var t = TOUR[i]; go(t[0], t[3], t[1]);
  say("<b>Step " + (i + 1) + " of " + TOUR.length + "</b><br>" + t[2]);
  choices([i < TOUR.length - 1 ? ["Next →", function () { tour(i + 1); }, 1] : ["Finish", function () { jump(); say("You’re all set! Click me any time you want a hand."); choices([["Quiz me", quizStart, 1], BACK]); }, 1],
    i > 0 ? ["← Back", function () { tour(i - 1); }] : null, ["End tour", home]]);
}
/* --- quiz --- */
var QUIZ = [
  ["Which machine cuts aluminum at REEF?", ["Carvera Air", "Shapeoko 5 Pro"], "Aluminum stays on the Carvera Air.", 1, ["machines", function () { S.mach = "ca"; }, '#stage [data-info="ca_stock"]']],
  ["Which endmill makes smooth, curved 3D surfaces?", ["Ball", "Flat", "V-bit"], "The round tip blends passes into a smooth surface.", 1, ["tools", function () { S.tool = "ball"; }, '#stage [data-info="em_groove"]']],
  ["What are tabs for?", ["Keeping the part attached so it can’t fly loose", "Making the cut faster", "Cooling the tool"], "Cut them off with a flush-cut saw and sand.", 1, ["paths", function () { S.sw = "cc"; S.op = "contour"; }, '#stage [data-info="tp_tab"]']],
  ["Dashed blue lines in a toolpath are…", ["Rapids — the tool is lifted, moving fast", "Cuts", "Tabs"], "Make sure clamps are below the safe height.", 1, ["paths", null, '#stage [data-info="tp_rapid"]']],
  ["Where is Z0 usually set?", ["Top of the stock", "Bottom of the spoilboard", "Tip of the spindle"], "It must match the origin you chose in CAM.", 1, ["paths", null, '#stage [data-info="tp_zero"]']],
  ["Where do the composite brad nails go when you hold stock to the spoilboard?", ["In waste areas, outside every toolpath", "Anywhere is fine", "Inside the pocket"], "Plastic nails won’t wreck a bit, but nails in a toolpath can pull a part loose or leave plastic in the cut.", 1, ["machines", function () { S.mach = "so"; }, '#stage [data-info="so_clamps"]']],
  ["Feed rate equals…", ["RPM × flutes × chipload", "RPM ÷ flutes", "Chipload × depth of cut"], "Change any one of those and the feed changes.", 2, ["feeds", null, '#rail [data-info="fs_feed"]']],
  ["Fine dust and a burning smell usually mean…", ["Rubbing — chipload is too small", "The feed is too high", "Everything is perfect"], "Raise feed or lower RPM to make real chips.", 2, ["feeds", null, "#rail section:last-child"]],
  ["Why does REEF use composite (plastic) brad nails instead of steel ones on the Shapeoko?", ["If the endmill hits one, it cuts through instead of breaking the bit", "They hold harder than steel", "They’re magnetic"], "Steel nails, staples or screws in the cut can shatter an endmill.", 2, ["machines", function () { S.mach = "so"; }, '#stage [data-info="so_clamps"]']],
  ["Which program makes 3D toolpaths at REEF?", ["Fusion 360", "Carbide Create"], "Carbide Create is for 2D jobs on the Shapeoko.", 2, ["paths", function () { S.sw = "f"; }, '#rail [data-set="sw"]']],
  ["Adaptive clearing works best with…", ["Deep depth of cut, narrow width", "Shallow depth, full width", "Full depth, full width"], "Steady tool load — great for the 200 W Carvera Air.", 3, ["paths", function () { S.sw = "f"; S.op = "adaptive"; }, "#playBtn"]],
  ["A 90° V-bit cutting 2 mm deep makes a groove how wide?", ["4 mm", "2 mm", "1 mm"], "Width = 2 × depth × tan(45°) = 2 × depth.", 3, ["tools", function () { S.tool = "taper"; S.taper = 1; }, '#stage [data-info="em_groove"]']]
];
var Q = null;
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function quizStart() { Q = { list: shuffle(QUIZ.filter(function (q) { return q[3] <= S.mode; })).slice(0, 4), i: 0, score: 0 }; say("Quick quiz — " + Q.list.length + " questions at your level. Ready?"); ask(); }
function ask() {
  if (Q.i >= Q.list.length) { say("You got <b>" + Q.score + " of " + Q.list.length + "</b>. " + (Q.score === Q.list.length ? "Perfect!" : "Nice work — try again to see different questions.")); choices([["Quiz me again", quizStart, 1], BACK]); return; }
  var q = Q.list[Q.i], ans = shuffle(q[1].map(function (t, i) { return { t: t, ok: i === 0 }; }));
  say("<b>Q" + (Q.i + 1) + ".</b> " + q[0]);
  choices(ans.map(function (a) { return [a.t, function () {
    if (a.ok) { Q.score++; jump(); say("Correct! " + q[2]); } else say("Not quite — it’s <b>" + q[1][0] + "</b>. " + q[2]);
    Q.i++;
    choices([["Next question", ask, 1], ["Show me", function () { go(q[4][0], q[4][1], q[4][2]); say("There it is — look for the yellow ring on the page."); choices([["Next question", ask, 1], ["Stop quiz", home]]); }], ["Stop quiz", home]]);
  }]; }));
}

/* ================= STAFF PHOTO MODE ================= */
var sb = $("staffBar");
function drawStaff() {
  sb.hidden = !STAFF; if (!STAFF) return;
  var keys = Object.keys(PHOTO_KEYS), have = keys.filter(function (k) { return PHOTOS[k]; }).length;
  sb.innerHTML = '<div class="in"><b>Staff photo mode</b><span>' + have + " of " + keys.length + " suggested photos added. Pick an item, then use <b>Add photo</b> in the Info panel. When done, save the new file.</span>" +
    '<div class="chips">' + keys.map(function (k) { return '<button type="button" class="chip" data-pk="' + k + '">' + (PHOTOS[k] ? "✓ " : "") + I[k].t + "</button>"; }).join("") + "</div>" +
    '<button type="button" class="btn pri" id="saveHtml">Save HTML with photos</button><button type="button" class="btn sec" id="exitStaff">Exit staff mode</button></div>';
}
function jumpTo(k) {
  var pre = k.slice(0, 3);
  go(pre === "so_" || pre === "ca_" ? "machines" : "tools", function () {
    if (pre === "so_") S.mach = "so"; else if (pre === "ca_") S.mach = "ca";
    else if (k === "em_helix") { S.tool = "flat"; if (S.mode < 2) { S.mode = 2; drawMode(); } }
    else S.tool = k.slice(3);
  });
  var el = document.querySelector('#stage [data-info="' + k + '"]') || document.querySelector('[data-info="' + k + '"]');
  if (el) { showCard(el, true); el.scrollIntoView({ block: "center", behavior: "smooth" }); } else cardKey(k);
}
function readPhoto(file, cb) {
  var fr = new FileReader();
  fr.onload = function () { var im = new Image(); im.onload = function () {
    var s = Math.min(1, 1100 / Math.max(im.width, im.height)), cv = document.createElement("canvas");
    cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s); cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
    cb(cv.toDataURL("image/jpeg", 0.82)); }; im.src = fr.result; };
  fr.readAsDataURL(file);
}
function saveHTML() {
  var tag = '<script type="application/json" id="photoData">', i0 = INITIAL.indexOf(tag), i1 = INITIAL.indexOf("</" + "script>", i0);
  if (i0 < 0 || i1 < 0) { alert("Couldn’t find the photo block in this file."); return; }
  var out = "<!doctype html>\n" + INITIAL.slice(0, i0 + tag.length) + JSON.stringify(PHOTOS).replace(/</g, "\\u003c") + INITIAL.slice(i1);
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([out], { type: "text/html" })); a.download = "reef-cnc-milling-trainer.html";
  document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
sb.addEventListener("click", function (e) {
  var c = e.target.closest("[data-pk]"); if (c) { jumpTo(c.getAttribute("data-pk")); return; }
  if (e.target.id === "saveHtml") saveHTML();
  if (e.target.id === "exitStaff") { STAFF = false; drawStaff(); }
});
card.addEventListener("change", function (e) {
  var t = e.target; if (!t.hasAttribute("data-photo") || !t.files[0]) return;
  var key = t.getAttribute("data-photo");
  readPhoto(t.files[0], function (url) { PHOTOS[key] = url; cardKey(key); drawStaff(); });
});
card.addEventListener("click", function (e) {
  var b = e.target.closest("[data-unphoto]"); if (!b) return; var key = b.getAttribute("data-unphoto"); delete PHOTOS[key]; cardKey(key); drawStaff();
});
document.addEventListener("keydown", function (e) { if (e.ctrlKey && e.altKey && e.shiftKey && (e.key === "P" || e.key === "p")) { STAFF = !STAFF; drawStaff(); } });
drawStaff();

})();
